name: Backend CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: backend-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Build Context
        run: |
          pwd
          git rev-parse HEAD
          ls -la
          ls -la scripts/
          git ls-files scripts/

      - name: Set Docker Image Name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Set Docker Image Name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Deploy to Ubuntu Server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: GHCR_TOKEN,GHCR_USERNAME,IMAGE_NAME,IMAGE_TAG
          script: |
            set -e

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USERNAME" --password-stdin

            cd ~/convenience-order

            test -f .env || {
              echo "Deployment failed: .env file does not exist."
              exit 1
            }

            IMAGE="ghcr.io/${IMAGE_NAME}:${IMAGE_TAG}"

            echo "Pulling image: $IMAGE"
            docker pull "$IMAGE"

            echo "Running database migrations..."
            docker run --rm \
              --add-host=host.docker.internal:host-gateway \
              --env-file .env \
              "$IMAGE" \
              npm run migrate

            echo "Creating administrator account..."
            docker run --rm \
              --add-host=host.docker.internal:host-gateway \
              --env-file .env \
              "$IMAGE" \
              npm run seed:admin

            echo "Replacing application container..."
            docker stop convenience-order-api || true
            docker rm convenience-order-api || true

            docker run -d \
              --name convenience-order-api \
              --restart unless-stopped \
              --add-host=host.docker.internal:host-gateway \
              --env-file .env \
              -p 127.0.0.1:3000:3000 \
              "$IMAGE"

            echo "Checking application status..."
            sleep 5

            if [ "$(docker inspect -f '{{.State.Running}}' convenience-order-api)" != "true" ]; then
              echo "Deployment failed: container is not running."
              docker logs convenience-order-api
              exit 1
            fi

            echo "Deployment completed successfully."

            docker image prune -f

        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}